<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Acesso negado')}"></head>
<body class="mb-root" style="min-height: 100vh; display: flex; flex-direction: column">
<header th:replace="~{fragments/layout :: navbar('nenhum')}"></header>
<main class="mb-page" style="flex: 1">
    <div class="mb-container">
        <div class="mb-card mb-empty" style="max-width: 560px; margin: 32px auto">
            <span class="mb-empty__art">
                <svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><circle cx="12" cy="16" r="1"></circle><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            </span>
            <!-- ADMIN cai aqui ao tentar comprar (Q7); os demais, ao abrir área de administrador -->
            <th:block sec:authorize="hasRole('ADMIN')">
                <h1 class="mb-empty__title">Conta de administrador não faz compras.</h1>
                <p>Para comprar, entre com uma conta de cliente.</p>
                <a class="mb-btn mb-btn--primary" th:href="@{/admin/dashboard}">Voltar para o dashboard</a>
            </th:block>
            <th:block sec:authorize="!hasRole('ADMIN')">
                <h1 class="mb-empty__title">Essa área é só para administradores.</h1>
                <p>Sua conta é de cliente. Para gerenciar produtos ou ver o dashboard, entre com uma conta de administrador.</p>
                <a class="mb-btn mb-btn--primary" th:href="@{/products}">Voltar para a loja</a>
            </th:block>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
