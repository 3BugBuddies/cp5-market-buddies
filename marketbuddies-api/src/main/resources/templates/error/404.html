<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página não encontrada')}"></head>
<body class="mb-root" style="min-height: 100vh; display: flex; flex-direction: column">
<header th:replace="~{fragments/layout :: navbar('nenhum')}"></header>
<main class="mb-page" style="flex: 1">
    <div class="mb-container">
        <div class="mb-card mb-empty" style="max-width: 560px; margin: 32px auto">
            <span class="mb-empty__art">
                <svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path><path d="M9 9l4 4M13 9l-4 4"></path></svg>
            </span>
            <h1 class="mb-empty__title">Não encontramos essa página.</h1>
            <p th:if="${message != null and message != '' and message != 'No message available'}" th:text="${message}">Produto não encontrado.</p>
            <p th:unless="${message != null and message != '' and message != 'No message available'}">O endereço pode estar errado ou o item saiu do catálogo.</p>
            <a class="mb-btn mb-btn--primary" th:href="@{/products}">Ver produtos</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
