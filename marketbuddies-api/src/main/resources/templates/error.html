<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Algo deu errado')}"></head>
<body class="mb-root" style="min-height: 100vh; display: flex; flex-direction: column">
<header th:replace="~{fragments/layout :: navbar('nenhum')}"></header>
<main class="mb-page" style="flex: 1">
    <div class="mb-container">
        <div class="mb-card mb-empty" style="max-width: 560px; margin: 32px auto">
            <span class="mb-empty__art">
                <svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.4 3.9L2.6 17.4A1.8 1.8 0 0 0 4.2 20h15.6a1.8 1.8 0 0 0 1.6-2.6L13.6 3.9a1.8 1.8 0 0 0-3.2 0z"></path></svg>
            </span>
            <h1 class="mb-empty__title">
                <span th:if="${status != null}" th:text="'Erro ' + ${status} + ' · '">Erro 500 · </span>Algo deu errado.
            </h1>
            <!-- Mensagem de domínio (ViewExceptionHandler); erro inesperado mostra só o texto genérico -->
            <p th:if="${message != null and message != '' and message != 'No message available'}" th:text="${message}">Sem estoque para Leite integral 1 L.</p>
            <p th:unless="${message != null and message != '' and message != 'No message available'}">Tente de novo em instantes. Se continuar, volte para a loja e refaça o caminho.</p>
            <a class="mb-btn mb-btn--primary" th:href="@{/products}">Voltar para a loja</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
