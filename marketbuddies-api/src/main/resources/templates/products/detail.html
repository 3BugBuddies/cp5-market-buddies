<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body class="mb-root" style="min-height: 100vh; display: flex; flex-direction: column">
<header th:replace="~{fragments/layout :: navbar('produtos')}"></header>
<main class="mb-page" style="flex: 1" th:with="p=${product}">
    <div class="mb-container" style="display: flex; flex-direction: column; gap: 24px">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <nav aria-label="Trilha" style="font-size: var(--mb-fs-sm); color: var(--mb-ink-600); display: flex; flex-wrap: wrap; gap: 8px">
            <a th:href="@{/products}">Produtos</a><span aria-hidden="true">›</span>
            <a th:href="@{/products(category=${p.category.name()})}" th:text="${p.category.label}">Mercearia</a><span aria-hidden="true">›</span>
            <span th:text="${p.name}">Café torrado e moído 500 g</span>
        </nav>
        <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
            <div class="mb-detail__media">
                <span th:if="${p.onSale and p.stock > 0}" class="mb-badge mb-badge--offer" style="position: absolute; top: 16px; left: 16px"
                      th:text="'Oferta −' + ${p.discountPercentage.stripTrailingZeros().toPlainString()} + '%'">Oferta −7%</span>
                <span th:if="${p.stock == 0}" class="mb-badge mb-badge--danger" style="position: absolute; top: 16px; left: 16px">Esgotado</span>
                <svg class="mb-icon" viewBox="0 0 24 24" style="width: 120px; height: 120px; stroke-width: 1.2" aria-hidden="true"><path d="M7 10l5-6 5 6"></path><path d="M21 10l-2 8a2 2 0 0 1-2 1.5H7A2 2 0 0 1 5 18l-2-8z"></path><circle cx="12" cy="15" r="2"></circle></svg>
            </div>
            <section style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
                <span style="font-size: var(--mb-fs-sm); color: var(--mb-ink-600)" th:text="${p.category.label}">Mercearia</span>
                <h1 style="margin: 0" th:text="${p.name}">Café torrado e moído 500 g</h1>
                <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px">
                    <span th:if="${p.onSale}" style="font-size: var(--mb-fs-xl); font-weight: 700; color: var(--mb-red-600)"
                          th:text="'R$ ' + ${#numbers.formatDecimal(p.finalPrice, 1, 'POINT', 2, 'COMMA')}">R$ 18,71</span>
                    <span th:if="${p.onSale}" style="font-size: var(--mb-fs-md); color: var(--mb-ink-600); text-decoration: line-through"
                          th:text="'R$ ' + ${#numbers.formatDecimal(p.price, 1, 'POINT', 2, 'COMMA')}">R$ 20,12</span>
                    <span th:unless="${p.onSale}" style="font-size: var(--mb-fs-xl); font-weight: 700"
                          th:text="'R$ ' + ${#numbers.formatDecimal(p.price, 1, 'POINT', 2, 'COMMA')}">R$ 5,88</span>
                </div>
                <div>
                    <span th:if="${p.stock > 5}" class="mb-badge mb-badge--success" th:text="'Em estoque · ' + ${p.stock} + ' un.'">Em estoque · 18 un.</span>
                    <span th:if="${p.stock > 0 and p.stock <= 5}" class="mb-badge mb-badge--warning" th:text="'Últimas ' + ${p.stock} + ' unidades'">Últimas 4 unidades</span>
                    <span th:if="${p.stock == 0}" class="mb-badge mb-badge--danger">Sem estoque</span>
                </div>
                <p style="margin: 0; color: var(--mb-ink-600); max-width: 60ch"
                   th:text="${p.description != null} ? ${p.description} : 'Produto selecionado pelo MarketBuddies.'">Descrição</p>

                <!-- POST /cart/add é do carrinho (T6). ADMIN não compra (Q7) -->
                <form sec:authorize="!hasRole('ADMIN')" th:if="${p.stock > 0}" th:action="@{/cart/add}" method="post"
                      style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 8px">
                    <input type="hidden" name="productId" th:value="${p.id}">
                    <div class="mb-field">
                        <span class="mb-label" id="dt-qtd-l">Quantidade</span>
                        <div class="mb-stepper" role="group" aria-labelledby="dt-qtd-l" data-stepper>
                            <button type="button" aria-label="Diminuir" data-step="-1">−</button>
                            <input type="number" name="quantity" value="1" min="1" th:max="${p.stock}" inputmode="numeric" aria-labelledby="dt-qtd-l">
                            <button type="button" aria-label="Aumentar" data-step="1">+</button>
                        </div>
                    </div>
                    <button class="mb-btn mb-btn--buy" type="submit" th:data-unit-price="${p.finalPrice}">
                        <svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="17" cy="19" r="2"></circle><path d="M17 17H6V3H4"></path><path d="M6 5l14 1-1 7H6"></path></svg>
                        Adicionar ao carrinho · <span data-subtotal th:text="'R$ ' + ${#numbers.formatDecimal(p.finalPrice, 1, 'POINT', 2, 'COMMA')}">R$ 18,71</span>
                    </button>
                </form>
                <div sec:authorize="!hasRole('ADMIN')" th:if="${p.stock == 0}" style="margin-top: 8px">
                    <button class="mb-btn mb-btn--buy" type="button" disabled>Adicionar ao carrinho</button>
                </div>
                <div sec:authorize="hasRole('ADMIN')" class="mb-alert mb-alert--info" style="margin-top: 8px">
                    <svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
                    <span>Conta de administrador não faz compras. <a th:href="@{/admin/products}">Editar na gestão de produtos</a></span>
                </div>
                <p style="margin: 0; font-size: var(--mb-fs-xs); color: var(--mb-ink-600)"
                   th:text="'Código do produto: ' + ${p.id} + ' · Máximo por compra: o estoque disponível (' + ${p.stock} + ').'">Código do produto: 7</p>
            </section>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
