# Infraestrutura local: PostgreSQL + RabbitMQ com painel de gerenciamento.
# Os três serviços Java rodam pela IDE.
#   docker compose up -d
#   Painel do RabbitMQ: http://localhost:15672 (guest / guest)

services:
  postgres:
    image: postgres:18
    container_name: marketbuddies-postgres
    environment:
      POSTGRES_DB: marketbuddies
      POSTGRES_USER: marketbuddies
      POSTGRES_PASSWORD: marketbuddies
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: marketbuddies-rabbitmq
    environment:
      # Na imagem 4.x o painel vem sem coleta de métricas (sem conexões, consumidores
      # nem gráfico de mensagens). Religada para o vídeo; o Railway usa a mesma variável.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management_agent disable_metrics_collector false"
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
